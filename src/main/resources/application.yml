spring:
  application:
    name: releaseguard
  profiles:
    default: demo
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/releaseguard;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  shutdown: graceful
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
releaseguard:
  api-key: ${RELEASEGUARD_API_KEY:local-demo-key}
  max-concurrent-runs: 2
  max-window-seconds: 300
  max-checks-per-run: 300
  retained-runs: 100
  max-attempts: 3
  retry-backoff: 100ms
  schedule:
    enabled: false
    cron: "0 */5 * * * *"
    window-seconds: 10
    interval-seconds: 2
  alerts:
    enabled: ${ALERTS_ENABLED:false}
    from: releaseguard@example.test
    to:
      - team@example.test
  elasticsearch:
    enabled: false
    url: http://localhost:9200
    index: logs-*
    api-key: ${ELASTICSEARCH_API_KEY:}
logging:
  level:
    dev.badrilogaram.releaseguard: INFO
